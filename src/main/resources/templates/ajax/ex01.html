<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ajax</title>
</head>
<body>
	<h2>AJAX 테스트 </h2>
	
	<label>이름</label><input type ="text" id = "nameInput">
	<label>생년월일</label><input type = "text" id = "birthdayInput">
	<button id = "inputBtn" type ="button">입력</button>
	
	<!--  입력한 일므고 ㅏ생년월일을 기반으로 일므과 나이를 새로고침 없이 서버로 부터 얻어와서 표시한다 -->
	
	<div>이름 : <span id = "nameSpan"> </span> </div>
	<div>나이 : <span id = "ageSpan"> </span> </div>
	
	<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
	<script>
		$("#inputBtn").on("click",function(){
			
			let name = $("#nameInput").val();
			let birthday = $("#birthdayInput").val();
			
			$.ajax({
				type:"GET",
				url:"/ajax/person",
				dataType:"JSON",
				data: {"name" : name, "birthday" : birthday},
				success : function(response){
					//응답이 정상적으로 전달되었을때 수행할 기능 
					// 해당 함수의 파라미터를 통해 response body 데이터를 전달 받는다.
					// json 문자열 
					// {"name" : "김인규" , "age" : 32}
					// response body 에 담긴 json 문자열을 javascript에서 손쉽게 사용하도록
					// json 문자열 javascript 객체로 변환해준다.
					// alert(response.name + " " + response.age);
					
					$("#nameSpan").text(response.name);
					$("#ageSpan").text(response.age);
					
					
					
				},
				complete : function(data){
					
				},
				error : function(xhr, status, error){
					
				}
				
				
			});
			
		});
	
	</script>

</body>
</html>
