<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h3>thymeleaf 반복문</h3>
	
	<!-- 0부터 4까지 출력 -->
	<div th:each="i : ${#numbers.sequence(0,4)}" th:text="${i}"></div>

	<!-- fruitsList 반복 출력 -->
	<h2>반</h2>
	<div th:each="fruit, status : ${fruitList}">
		<span th:text="${fruit}"></span>
		<span th:text="${status.index + ' ' + status.count + ' |'}"></span>
	</div> 
	
	<h3> 맵리스트</h3>
	<table border="1">
		<thead>
			<tr>
				<th>이름</th>
				<th>나이</th>
				<th>취미</th>
			</tr>
		</thead>
		<tbody>
				
			<tr th:each="user:${userList}">
				<td th:text="${user.name}">유재석</td>
				<td th:text="${user.age}">34</td>
				<td th:text="${user.hobby}">진행하기</td>
			</tr>
			
			
		</tbody>
	</table>
</body>
</html>
